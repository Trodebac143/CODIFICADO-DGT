<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Consulta Infracciones DGT</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/vmp.css">
</head>
<body class="con-theme-toggle">
<button id="themeToggle" class="themeToggle" type="button">🌙 Noche</button>
<div class="app">
  <div class="hero">
    <h1>Consulta infracciones DGT</h1>
    <p>Consulta cerrada por árbol de decisiones.</p>
  </div>

  <div class="panel">
    <div class="section">
      <h2>Materia</h2>
      <div class="row" id="materiaRow">
        <button data-materia="ALCOHOL">ALCOHOL</button>
        <button data-materia="DROGAS">DROGAS</button>
        <button data-materia="SOA">SOA</button>
        <button data-materia="ITV">ITV</button>
        <button data-materia="PERMISOS">PERMISOS CONDUCIR</button>
        <button data-materia="VMP">NOTAS VMPs</button>
        <button id="btnApuntesRef" class="refButton" type="button">📄 Documentos</button>
      </div>
    </div>

    <div id="treeArea" class="stack"></div>

    <div class="actions" id="actionBar">
      <button class="primary" id="btnResolver" type="button">Resolver</button>
      <button id="btnVolver" type="button">Volver</button>
      <button id="btnLimpiar" type="button">Limpiar</button>
    </div>

    <div id="resultado" class="result">Selecciona una materia para empezar.</div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/ficha.js"></script>
  <div class="oficial-firma">OFICIAL 46244143</div>
</body>
</html>
