<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apuntes de referencia</title>
  <link rel="stylesheet" href="styles/base.css">
</head>
<body class="con-theme-toggle">
<button id="themeToggle" class="themeToggle" type="button">🌙 Noche</button>
  <div class="app">
    <div class="hero">
      <h1>Apuntes de referencia</h1>
      <p>Repositorio de documentos operativos de apoyo.</p>
    </div>

    <div class="top-actions">
      <button class="primary" onclick="window.location.href='index.html'">⬅ Volver a pantalla principal</button>
    </div>

    <div class="panel">
      <div class="section">
        <h2>Documentos disponibles</h2>
      </div>

      <div class="doc-grid" id="lista-documentos">
        <article class="doc-card">
          <h3>Cargando documentos...</h3>
          <p>Preparando el índice de documentos de referencia.</p>
        </article>
      </div>
    </div>
  </div>

<script src="documentos-index.js"></script>
<script>
(function(){
 const btn=document.getElementById("themeToggle");
 const saved=localStorage.getItem("temaAppDGT")||"dia";
 function apply(t){const dark=t==="noche";document.body.classList.toggle("dark-mode",dark);btn.textContent=dark?"🌙 Noche":"☀️ Día";localStorage.setItem("temaAppDGT",t);}
 apply(saved);
 btn.addEventListener("click",()=>apply(document.body.classList.contains("dark-mode")?"dia":"noche"));
})();
</script>
<script>
(function(){
  const contenedor = document.getElementById("lista-documentos");

  function escapar(texto){
    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function pintarDocumentos(datos){
    if(!contenedor) return;

    const documentos = datos && Array.isArray(datos.documentos) ? datos.documentos : [];
    contenedor.innerHTML = "";

    if(documentos.length === 0){
      contenedor.innerHTML = `
        <article class="doc-card">
          <h3>No hay documentos disponibles</h3>
          <p>Añade archivos a la carpeta documentos y ejecuta generar_indice_documentos.py.</p>
        </article>
      `;
      return;
    }

    documentos.forEach(function(doc){
      const nombre = doc.nombre || (doc.archivo || "").split("/").pop();
      const titulo = doc.titulo || nombre || "Documento";
      const tipo = doc.tipo || "DOC";
      const descripcion = doc.descripcion || "Documento de referencia operativo.";
      const urlVisor = "visor_documento.html?doc=" + encodeURIComponent(nombre) + "&from=apuntes";

      const tarjeta = document.createElement("article");
      tarjeta.className = "doc-card";
      tarjeta.innerHTML = `
        <h3>${escapar(titulo)}</h3>
        <p>${escapar(descripcion)} · ${escapar(tipo)}</p>
        <a class="button primary" href="${urlVisor}">
          Abrir documento
        </a>
      `;
      contenedor.appendChild(tarjeta);
    });
  }

  async function cargarIndice(){
    if(window.DOCUMENTOS_INDEX){
      pintarDocumentos(window.DOCUMENTOS_INDEX);
      return;
    }

    try{
      const respuesta = await fetch("documentos-index.json", {cache:"no-store"});
      if(!respuesta.ok) throw new Error("No se pudo cargar documentos-index.json");
      const datos = await respuesta.json();
      pintarDocumentos(datos);
    }catch(error){
      console.error(error);
      if(contenedor){
        contenedor.innerHTML = `
          <article class="doc-card">
            <h3>No se ha podido cargar el índice</h3>
            <p>Ejecuta python generar_indice_documentos.py desde la carpeta principal de la app.</p>
          </article>
        `;
      }
    }
  }

  cargarIndice();
})();
</script>

  <div class="oficial-firma">OFICIAL 46244143</div>
</body>
</html>
